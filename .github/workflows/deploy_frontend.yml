name: Deploy Real-Data Demo to GitHub Pages

# Builds the Next.js frontend as a static export using a REAL data snapshot
# (backend/scripts/build_static_snapshot.py, run here against live vnstock
# data) and publishes it to GitHub Pages. There is still no backend or
# database behind the deployed site itself -- GitHub Pages only serves static
# files -- so this bakes a fresh real snapshot into the site at build time
# instead. Runs on every push touching frontend/** or backend/**, plus
# hourly during HOSE trading hours so the public site's volume-anomaly
# detection stays reasonably current. This is the closest a static site can
# get to "real-time" -- GitHub's scheduler isn't guaranteed to fire exactly
# on the minute, and each run takes ~15-18 min end to end. See README.md
# "Live demo on GitHub Pages" for the one-time repo setting this depends on.
#
# IMPORTANT: vnstock has no verified historical foreign-flow endpoint (see
# scripts/build_static_snapshot.py), so the foreign_flow_5d factor is built
# by persisting each run's live snapshot into data/foreign_flow_history.json
# and COMMITTING IT BACK to the repo (the "Persist foreign-flow history"
# step below) -- GitHub Actions runners are ephemeral, so the git repo
# itself is the only persistence available across hourly runs. That commit
# only touches data/foreign_flow_history.json, which is deliberately outside
# this workflow's `push.paths` filter above, so it doesn't retrigger this
# same workflow; the commit message also carries [skip ci] as a second,
# repo-wide safety net against any other push-triggered workflow.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/deploy_frontend.yml"
  schedule:
    - cron: "0 2-8 * * 1-5" # hourly, 09:00-15:00 ICT (HOSE trading hours), weekdays
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit data/foreign_flow_history.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Generate real-data snapshot from live vnstock data
        working-directory: backend
        run: python -m scripts.build_static_snapshot --out ../frontend/public/data

      - name: Persist foreign-flow history
        # Best-effort: a rare push conflict here shouldn't block the site
        # deploy itself -- the history just doesn't gain a data point this
        # run and self-heals on the next one.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/foreign_flow_history.json
          if git diff --cached --quiet; then
            echo "No change to foreign-flow history, skipping commit."
          else
            git commit -m "Update foreign-flow history [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_MODE: static
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
